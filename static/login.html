<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – KrishiSankalp | AI Farm Assistant</title>
    <link rel="icon" type="image/png" href="/app-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a3d1f 0%, #107c41 50%, #1a6b3c 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .gov-top-bar { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.85); font-size: 0.75em; text-align: center; padding: 7px 20px; backdrop-filter: blur(8px); }
        .login-wrapper { display: flex; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.35); max-width: 900px; width: 100%; }
        .login-left { flex: 1; background: linear-gradient(160deg, #107c41, #0a3d1f); padding: 50px 40px; color: white; display: flex; flex-direction: column; justify-content: center; }
        .login-right { flex: 1; padding: 60px 50px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-right h1 { font-size: 1.6em; color: #002244; margin-bottom: 8px; }
        .google-btn-wrap { display: flex; justify-content: center; min-height: 48px; margin-bottom: 20px; }
        @media (max-width: 640px) { .login-left { display: none; } }
    </style>
</head>
<body>
    <div class="gov-top-bar">🇮🇳 Government of India Initiative &nbsp;|&nbsp; Ministry of Agriculture &amp; Farmers Welfare</div>
    <div class="login-wrapper">
        <div class="login-left">
            <h2>KrishiSankalp</h2>
            <p>India's AI-powered farming assistant. Get personalized crop recommendations, live market prices, and government scheme eligibility.</p>
        </div>
        <div class="login-right">
            <h1>Welcome Back</h1>
            <div class="google-btn-wrap">
                <div id="g_id_onload" data-client_id="40173321762-2jtubo41p8if7p0cru4jecho7m0jdc3f.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
                <div class="g_id_signin" data-type="standard"></div>
            </div>
        </div>
    </div>
    <script>
        if (localStorage.getItem('krishiUser')) window.location.href = '/';
        function handleCredentialResponse(response) {
            const base64 = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(atob(base64));
            localStorage.setItem('krishiUser', JSON.stringify({ name: payload.name, email: payload.email, picture: payload.picture, token: response.credential }));
            window.location.href = '/';
        }
    </script>
</body>
</html>
