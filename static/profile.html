<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile – KrishiSankalp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #eef2f7; color: #333; min-height: 100vh; }
        .gov-banner { 
            background: linear-gradient(90deg, #002244, #107c41); 
            color: white; 
            padding: 10px 20px; 
            font-size: 0.8em; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }
        .gov-banner span { line-height: 1.4; }
        .gov-banner a { color: #b2dfdb; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .gov-banner a:hover { color: white; }
        .gov-banner .nav-links { display: flex; gap: 16px; }
        
        .hero { background: linear-gradient(180deg, #FF9933 0%, #FFFFFF 50%, #138808 100%); padding: 40px 20px 80px; text-align: center; color: #333; }
        .avatar-ring { width: 100px; height: 100px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.8); margin: 0 auto 15px; overflow: hidden; background: #1a5c32; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .avatar-ring img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .verified-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); border-radius: 20px; padding: 3px 12px; font-size: 0.75em; margin-bottom: 8px; backdrop-filter: blur(4px); color: #002244; font-weight: 600; }
        .hero h1 { font-size: 1.7em; font-weight: 700; margin-bottom: 4px; }
        .hero .email { font-size: 0.85em; opacity: 0.8; margin-bottom: 25px; word-break: break-word; }
        
        .stats-row { display: flex; justify-content: center; gap: 0; flex-wrap: wrap; }
        .stat-item { padding: 0 20px; border-right: 1px solid rgba(0,0,0,0.1); text-align: center; margin-bottom: 10px; }
        .stat-item:last-child { border-right: none; }
        .stat-item .num { font-size: 1.8em; font-weight: 700; line-height: 1; }
        .stat-item .label { font-size: 0.65em; opacity: 0.8; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
        
        .page-content { max-width: 860px; margin: 20px auto 40px; padding: 0 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 650px) { 
            .grid-2 { grid-template-columns: 1fr; }
            .gov-banner { justify-content: center; text-align: center; }
            .gov-banner > span { width: 100%; text-align: center; }
            .gov-banner .nav-links { width: 100%; justify-content: center; }
        }
        
        .card { background: white; border-radius: 16px; padding: 22px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); }
        .card-title { font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #107c41; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
        .row { display: flex; justify-content: space-between; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid #f3f4f6; font-size: 0.88em; gap: 10px; }
        .row:last-of-type { border-bottom: none; }
        .row .k { color: #888; flex-shrink: 0; }
        .row .v { font-weight: 600; color: #1a1a2e; text-align: right; word-break: break-all; overflow-wrap: anywhere; }
        .tag { display: inline-block; background: #e8f5e9; color: #107c41; border-radius: 20px; padding: 3px 12px; font-size: 0.82em; font-weight: 600; }
        .btn-primary { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 20px; padding: 15px; background: linear-gradient(135deg, #107c41 0%, #0a5c30 100%); color: white; border: none; border-radius: 14px; font-size: 0.92em; font-weight: 600; cursor: pointer; text-decoration: none; box-shadow: 0 4px 15px rgba(16, 124, 65, 0.25); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-danger { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 12px; padding: 15px; background: white; color: #c62828; border: 2px solid #ffebee; border-radius: 14px; font-size: 0.92em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .activity-list { display: flex; flex-direction: column; gap: 10px; }
        .activity-item { display: flex; justify-content: space-between; align-items: center; background: #f8faf9; border-radius: 10px; padding: 14px 16px; font-size: 0.88em; }
        .activity-item .loc-name { font-weight: 600; color: #002244; }
        .count-pill { background: #107c41; color: white; border-radius: 20px; padding: 4px 12px; font-size: 0.82em; font-weight: 700; }
    </style>
</head>
<body>
    <div class="gov-banner">
        <span>🇮🇳 Government of India | Ministry of Agriculture &amp; Farmers Welfare</span>
        <div class="nav-links">
            <a href="/">← Dashboard</a>
            <a href="#" onclick="doLogout()">Logout</a>
        </div>
    </div>
    <div class="hero">
        <div class="avatar-ring">
            <img id="profilePic" src="">
        </div>
        <div class="verified-badge">✅ Verified Farmer Account</div>
        <h1 id="heroName">—</h1>
        <p class="email" id="heroEmail">—</p>
        <div class="stats-row">
            <div class="stat-item">
                <div class="num" id="statQueries">0</div>
                <div class="label">Recommendations</div>
            </div>
            <div class="stat-item">
                <div class="num" id="statStates">0</div>
                <div class="label">Locations Used</div>
            </div>
        </div>
    </div>
    <div class="page-content">
        <div class="grid-2">
            <div class="card">
                <div class="card-title">👤 Account Info</div>
                <div class="row"><span class="k">Full Name</span><span class="v" id="infoName">—</span></div>
                <div class="row"><span class="k">Email</span><span class="v" id="infoEmail">—</span></div>
                <div class="row"><span class="k">Account Type</span><span class="v"><span class="tag">Farmer</span></span></div>
            </div>
            <div class="card">
                <div class="card-title">🌱 My Farm</div>
                <div class="row"><span class="k">Location</span><span class="v" id="farmLocation">Not set</span></div>
                <div class="row"><span class="k">Soil Type</span><span class="v" id="farmSoil">Not set</span></div>
                <a class="btn-primary" href="/">Update Farm Details</a>
                <button class="btn-danger" onclick="doLogout()">Sign Out</button>
            </div>
        </div>
    </div>
    <script>
        const user = JSON.parse(localStorage.getItem('krishiUser'));
        if (!user) window.location.href = '/login.html';
        document.getElementById('profilePic').src = user.picture || 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=400&q=80';
        document.getElementById('heroName').innerText = user.name || '—';
        document.getElementById('heroEmail').innerText = user.email || '—';
        document.getElementById('infoName').innerText = user.name || '—';
        document.getElementById('infoEmail').innerText = user.email || '—';
        const farm = JSON.parse(localStorage.getItem('krishiFarmData')) || {};
        if (farm.location) document.getElementById('farmLocation').innerText = farm.location;
        if (farm.soil) document.getElementById('farmSoil').innerText = farm.soil;
        
        async function loadProfileStats() {
            try {
                const headers = {};
                if (user.token) headers['Authorization'] = `Bearer ${user.token}`;
                
                // Fetch user profile
                const profileRes = await fetch(`/api/user/profile/${encodeURIComponent(user.email)}`, { headers });
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    if (profileData.location) document.getElementById('farmLocation').innerText = profileData.location;
                    if (profileData.soil) document.getElementById('farmSoil').innerText = profileData.soil;
                }
                
                // Fetch public stats
                const statsRes = await fetch('/api/stats');
                if (statsRes.ok) {
                    const statsData = await statsRes.json();
                    document.getElementById('statQueries').innerText = statsData.total_queries || 0;
                    document.getElementById('statStates').innerText = Object.keys(statsData.locations || {}).length;
                }
            } catch (e) {
                console.error("Failed to load profile data:", e);
            }
        }
        loadProfileStats();
        
        function doLogout() { localStorage.removeItem('krishiUser'); window.location.href = '/login.html'; }
    </script>
</body>
</html>
