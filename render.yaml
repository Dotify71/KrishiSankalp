services:
  - type: web
    name: krishisankalp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: WEATHER_API_KEY
        sync: false
      - key: KINDWISE_TOKEN
        sync: false
      - key: AGRO_API_KEY
        sync: false
      - key: GOVT_DATA_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
